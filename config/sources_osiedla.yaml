# Lokalne / osiedlowe źródła (ładowane razem z sources_phase1.yaml).
#
# 1) wroclaw_go + ?miejsce=… — filtr miejsca na wroclaw.pl/go (najpewniej gdy w HTML jest JSON-LD).
#    Nowe: w filtrach na stronie wydarzeń wybierz miejsce i skopiuj pełny URL z paska adresu.
# 2) facebook_event_search — osobne zapytania na dzielnice (duplikaty FB i tak łączy fingerprint po ID wydarzenia).
# 3) generic_links — strony Rad Osiedla / osiedle.wroc.pl (często bez daty; verify_ssl jak zajezdnia).

