version: 1

# Events with a known start time outside this local window are not posted.
# Events with no known start time are kept. Set either bound to null to disable it.
schedule:
  block_starts_before: "06:00"
  block_starts_after: "18:05"

# Add your own rules here (case-insensitive; Polish ł matches l).
# Fields on a rule are AND-ed; use title_all when every fragment must appear in the title.
rules:
  - note: Recurring walk — Wrocław w pigułce
    url_contains: wroclaw-w-pigulce

  - note: Recurring walk — Wrocław w pigułce (title)
    title_all:
      - wroclaw
      - w pigulce

  - note: Wdech/Wydech rooftop opening
    url_contains: nowe-otwarcie-wdech-wydech-rooftop

  - note: Wdech/Wydech rooftop opening (title)
    title_all:
      - wdech wydech rooftop
      - nowe otwarcie
