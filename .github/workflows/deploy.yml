name: Deploy to VM

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VM_PORT: ${{ secrets.VM_SSH_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          PORT="${VM_PORT:-22}"
          ssh-keyscan -p "$PORT" "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy repo to VM
        run: |
          PORT="${VM_PORT:-22}"
          rsync -az --delete \
            -e "ssh -p $PORT" \
            ./ \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/wroclaw-events-bot/"

      - name: Install venv + deps on VM
        run: |
          PORT="${VM_PORT:-22}"
          ssh -p "$PORT" "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" 'bash -lc "
            set -euo pipefail
            cd /opt/wroclaw-events-bot
            python3 -m venv .venv
            ./.venv/bin/python -m pip install --upgrade pip
            ./.venv/bin/python -m pip install -r requirements.txt
            mkdir -p data
          "'

