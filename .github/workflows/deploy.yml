name: Deploy to VM

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Opt into Node.js 24 for JavaScript-based actions (ahead of the 2026 runner default).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      VM_PORT: ${{ secrets.VM_SSH_PORT }}
      VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          PORT="${VM_PORT:-22}"
          ssh-keyscan -p "$PORT" "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure deploy dir exists on VM
        run: |
          PORT="${VM_PORT:-22}"
          APP_DIR="${VM_APP_DIR:-/opt/wroclaw-events-bot}"
          ssh -p "$PORT" "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" "bash -lc 'mkdir -p \"$APP_DIR\"'"

      - name: Copy repo to VM
        run: |
          PORT="${VM_PORT:-22}"
          APP_DIR="${VM_APP_DIR:-/opt/wroclaw-events-bot}"
          rsync -az --delete \
            -e "ssh -p $PORT" \
            ./ \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:$APP_DIR/"

      - name: Install venv + deps on VM
        run: |
          PORT="${VM_PORT:-22}"
          APP_DIR="${VM_APP_DIR:-/opt/wroclaw-events-bot}"
          ssh -p "$PORT" "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" 'bash -lc "
            set -euo pipefail
            cd '"$APP_DIR"'
            python3 -m venv .venv
            ./.venv/bin/python -m pip install --upgrade pip
            ./.venv/bin/python -m pip install -r requirements.txt
            mkdir -p data
          "'

