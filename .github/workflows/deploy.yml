name: Deploy to VM

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VM_PORT: ${{ secrets.VM_SSH_PORT }}
      VM_APP_DIR: ${{ secrets.VM_APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          PORT="${VM_PORT:-22}"
          ssh-keyscan -p "$PORT" "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure deploy dir exists on VM
        run: |
          PORT="${VM_PORT:-22}"
          APP_DIR="${VM_APP_DIR:-$HOME/wroclaw-events-bot}"
          ssh -p "$PORT" "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" "bash -lc 'mkdir -p \"$APP_DIR\"'"

      - name: Upload tarball to VM
        run: |
          PORT="${VM_PORT:-22}"
          APP_DIR="${VM_APP_DIR:-$HOME/wroclaw-events-bot}"
          tar --exclude=".git" --exclude=".venv" --exclude="data" -czf app.tgz .
          scp -P "$PORT" app.tgz "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:$APP_DIR/app.tgz"

      - name: Extract + install deps on VM
        run: |
          PORT="${VM_PORT:-22}"
          APP_DIR="${VM_APP_DIR:-$HOME/wroclaw-events-bot}"
          ssh -p "$PORT" "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" 'bash -lc "
            set -euo pipefail
            cd '"$APP_DIR"'
            tar -xzf app.tgz
            rm -f app.tgz
            python3 -m venv .venv
            ./.venv/bin/python -m pip install --upgrade pip
            ./.venv/bin/python -m pip install -r requirements.txt
            mkdir -p data
          "'

